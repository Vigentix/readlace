<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Readlace icon</title>
  <desc id="desc">An indigo stem, the layout that stays put, with one coral thread laced through it to draw the bowl and leg of an R: behind the stem at the top, over it at the waist. On a paper-white tile.</desc>
