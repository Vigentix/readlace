  <path fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" stroke="#2F2BA8" d="M51 25V103"/>
  <path fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" stroke="#F0614A" d="M67 75H51L66.36 83.96"/>
  </g>
</svg>
